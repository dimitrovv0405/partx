<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans&family=Space+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/styles/styles.css}">
    <link rel="stylesheet" th:href="@{/styles/order-success-styles.css}">
    <title>Order Confirmed</title>
</head>
<body>

<header>
    <h1 class="web-logo"><a th:href="@{/home}">PART<span>X</span></a></h1>
    <nav>
        <ul class="nav-links">
            <li><a th:href="@{/shop}">Shop</a></li>
            <li><a th:href="@{/orders}">My Orders</a></li>
        </ul>
    </nav>
    <div class="header-actions">
        <div class="header-balance-badge" style="display: flex; align-items: center; background: rgba(255, 255, 255, 0.07); padding: 6px 12px; border-radius: 4px; font-family: 'Space Mono', monospace; font-size: 14px; border: 1px solid rgba(255, 255, 255, 0.15); color: #fff;">
            <span style="color: #ff3e3e; margin-right: 6px;">💳</span>
            <span th:text="${balance != null ? '$' + balance : '$0.00'}"></span>
        </div>
        <form th:action="@{/users/profile}" method="get">
            <button type="submit" class="login-btn" th:text="${username != null ? username : '☺'}"></button>
        </form>
    </div>
</header>

<main>
    <div class="success-container">
        <div class="success-icon">✓</div>
        <h1 class="success-title">Payment Successful!</h1>
        <p class="success-message">
            Thank you for your purchase. You have successfully purchased your item.
            Your order had been confirmed, and you will receive it soon!
        </p>

        <div>
            <span class="order-id-box" th:text="'ORDER ID: ' + ${orderId}"></span>
        </div>

        <div class="action-btns">
            <a th:href="@{/orders}" class="btn-primary">Track In My Orders</a>
            <a th:href="@{/shop}" class="btn-secondary">Continue Shopping</a>
        </div>
    </div>
</main>

<footer>
    <p>© 2026 PARTX.com — All rights reserved.</p>
</footer>

</body>
</html>
