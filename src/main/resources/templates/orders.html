<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans&family=Space+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/styles/styles.css}">
    <link rel="stylesheet" th:href="@{/styles/orders-styles.css}">
    <title>My Orders</title>
</head>
<body>

<header>
    <h1 class="web-logo"><a th:href="@{/home}">PART<span>X</span></a></h1>
    <nav>
        <div class="hamburger" id="hamburger" onclick="toggleMenu()">
            <span></span>
            <span></span>
            <span></span>
        </div>
        <ul class="nav-links" id="nav-links">
            <li><a th:href="@{/shop}">Shop</a></li>
            <li><a th:href="@{/orders}">My Orders</a></li>

            <li th:if="${userRole == 'FREELANCER'}">
                <a th:href="@{/freelancer}">My Products</a>
            </li>
            <li>
                <form th:action="@{/auth/logout}" method="post">
                    <input type="hidden" name="${_csrf.parameterName}" value="${_csrf.token}"/>
                    <button type="submit">Logout</button>
                </form>
            </li>
        </ul>
    </nav>
    <div class="header-actions">
        <div class="header-balance-badge" style="display: flex; align-items: center; background: rgba(255, 255, 255, 0.07); padding: 6px 12px; border-radius: 4px; font-family: 'Space Mono', monospace; font-size: 14px; border: 1px solid rgba(255, 255, 255, 0.15); color: #fff;">
            <span style="color: #ff3e3e; margin-right: 6px;">💳</span>
            <span th:text="${balance != null ? '$' + balance : '$0.00'}"></span>
        </div>

        <form th:action="@{/users/profile}" method="get">
            <button type="submit"
                    class="login-btn"
                    id="user-btn"
                    th:text="${username != null ? username : '☺'}">
            </button>
        </form>
        <button class="cart-btn" th:onclick="|window.location.href='@{/cart}'|">
            🛒 Cart
        </button>
    </div>
</header>

<main class="orders-main">

    <div class="orders-container">

        <div class="orders-header-row">
            <h2 class="orders-title">My Orders</h2>
            <p class="orders-subtitle">Track and review your past purchases</p>
        </div>

        <!-- Filters -->
        <div class="orders-toolbar">
            <div class="orders-filter-group">
                <button class="status-filter-btn active" data-status="all" onclick="selectStatus(this)">All</button>
                <button class="status-filter-btn" data-status="PENDING" onclick="selectStatus(this)">Pending</button>
                <button class="status-filter-btn" data-status="PROCESSING" onclick="selectStatus(this)">Processing</button>
                <button class="status-filter-btn" data-status="SHIPPED" onclick="selectStatus(this)">Shipped</button>
                <button class="status-filter-btn" data-status="DELIVERED" onclick="selectStatus(this)">Delivered</button>
                <button class="status-filter-btn" data-status="CANCELLED" onclick="selectStatus(this)">Cancelled</button>
            </div>
            <select class="sort-select" id="sort-select" onchange="renderOrders()">
                <option value="newest">Newest First</option>
                <option value="oldest">Oldest First</option>
                <option value="total-desc">Total: High to Low</option>
                <option value="total-asc">Total: Low to High</option>
            </select>
        </div>

        <!-- Orders List -->
        <div class="orders-list" id="orders-list" style="display: flex; flex-direction: column; gap: 20px; max-width: 900px; margin-top: 30px;">
            <div th:each="order : ${orders}"
                 th:if="${order != null}"
                 class="order-card"
                 th:data-status="${order.status}"
                 th:data-price="${order.totalPrice}"
                 th:data-id="${order.id}"
                 th:data-date="${order.createdAt != null ? order.createdAt : order.id}"
                 style="background: #121212; border: 1px solid #c5f82a; border-radius: 8px; padding: 24px; display: flex; justify-content: space-between; align-items: center; transition: transform 0.2s, box-shadow 0.2s;"
                 onmouseover="this.style.transform='translateY(-2px)'; this.style.boxShadow='0 4px 20px rgba(197, 248, 42, 0.15)'"
                 onmouseout="this.style.transform='none'; this.style.boxShadow='none'">

                <div style="display: flex; flex-direction: column; gap: 8px;">
                    <div style="font-family: monospace; color: #666; font-size: 0.85rem;">
                        Order ID: <span th:text="${order.id}" style="color: #aaa;"></span>
                    </div>

                    <div style="display: inline-flex; align-items: center; margin-top: 4px;">
                        <span th:text="${order.status}"
                              th:style="'font-size: 0.75rem; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; padding: 4px 10px; border-radius: 4px; ' +
                                (${#strings.toString(order.status) == 'PENDING' || #strings.toString(order.status) == 'PROCESSING'} ? 'background: rgba(255, 193, 7, 0.1); color: #ffc107;' :
                                 (${#strings.toString(order.status) == 'SHIPPED' || #strings.toString(order.status) == 'DELIVERED'} ? 'background: rgba(40, 167, 69, 0.1); color: #28a745;' :
                                 'background: rgba(220, 53, 69, 0.1); color: #dc3545;'))">
                        </span>
                    </div>
                </div>

                <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 12px;">
                    <div style="text-align: right;">
                        <span style="color: #666; font-size: 0.8rem; display: block; text-transform: uppercase; letter-spacing: 0.5px;">Total Price</span>
                        <span th:text="${order?.totalPrice != null ? '$' + #numbers.formatDecimal(order.totalPrice, 1, 2) : '$0.00'}" style="color: #c5f82a; font-size: 1.5rem; font-weight: 700; font-family: monospace;">
                        </span>
                    </div>

                    <button type="button"
                            th:data-id="${order.id}"
                            onclick="openModal(this)"
                            style="background: transparent; border: 1px solid #ffffff; color: #ffffff; padding: 8px 16px; font-size: 0.85rem; font-weight: 600; cursor: pointer; border-radius: 4px; text-transform: uppercase; letter-spacing: 0.5px; transition: all 0.2s;"
                            onmouseover="this.style.background='#ffffff'; this.style.color='#000000'"
                            onmouseout="this.style.background='transparent'; this.style.color='#ffffff'">
                        View Details
                    </button>
                </div>

            </div>
        </div>

        <p class="empty-orders-msg" id="empty-orders-msg"
           th:if="${orders == null or #lists.isEmpty(orders)}" style="display: block;">
            No orders found. <a th:href="@{/shop}">Start shopping</a>
        </p>

    </div>

</main>

<!-- Order Detail Modal -->
<div class="modal-overlay" id="modal-overlay" onclick="closeModal()">
    <div class="modal-box" onclick="event.stopPropagation()">
        <button class="modal-close-btn" onclick="closeModal()">✕</button>
        <h3 class="modal-title">Order Details</h3>
        <div id="modal-content"></div>
    </div>
</div>

<footer>
    <p>© 2025 PARTX.com — All rights reserved.</p>
</footer>

<script th:src="@{/scripts/main.js}"></script>
<script th:src="@{/scripts/orders.js}"></script>

</body>
</html>
